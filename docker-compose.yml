services:
  backend:
    build: ./backend
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET tanımlı olmalı (.env dosyasına yazın)}
      FRONTEND_URL: http://localhost:5173
      DB_PATH: /data/database.sqlite
    volumes:
      - backend-data:/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      # Tarayıcıdan gelen /api istekleri Vite proxy'si ile backend servisine iletilir.
      VITE_PROXY_TARGET: http://backend:3001
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
